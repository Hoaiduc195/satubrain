[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satubrain"
version = "1.0.0rc1"
description = "Local-first task memory for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amnansyahmi"}]
keywords = ["mcp", "agent-memory", "coding-agents", "sqlite"]
dependencies = []

[project.optional-dependencies]
sync = ["cryptography>=44,<51"]
test = ["mcp>=1.20,<2"]

[project.scripts]
satubrain = "satubrain.cli:main"

[tool.setuptools.packages.find]
include = ["satubrain", "satubrain.*"]

[tool.setuptools.package-data]
satubrain = ["web/*.html", "web/*.css", "web/*.js"]
